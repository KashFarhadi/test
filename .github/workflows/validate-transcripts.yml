name: Extract requested YouTube transcript

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract and validate requested video
        run: |
          python reliable_transcript.py \
            "https://www.youtube.com/watch?v=QBfXiWvM0qc" \
            --output-dir artifacts \
            --attempts-per-route 3 \
            --strict

      - name: Upload transcript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-QBfXiWvM0qc
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
