name: Validate YouTube transcript pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m yt_dlp --version
          node --version
          ffmpeg -version | head -n 1

      - name: Run deterministic unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run ten-video live validation
        run: |
          python extract_transcript.py \
            --matrix test_matrix.json \
            --output-dir artifacts \
            --attempts-per-route 2 \
            --asr-model tiny.en \
            --strict

      - name: Publish validation summary
        if: always()
        run: |
          if [ -f artifacts/validation-summary.md ]; then
            cat artifacts/validation-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload transcript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-validation-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
