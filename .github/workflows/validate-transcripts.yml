name: Validate production YouTube transcript pipeline

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run production extractor across ten videos
        run: |
          python reliable_transcript.py \
            --matrix test_matrix.json \
            --output-dir artifacts \
            --attempts-per-route 3 \
            --strict

      - name: Fetch exact target ten consecutive times
        run: |
          mkdir -p provider-artifacts
          python repeat_target_probe.py

      - name: Upload production transcript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-validation-evidence
          path: |
            artifacts/
            provider-artifacts/
          if-no-files-found: warn
          retention-days: 7
