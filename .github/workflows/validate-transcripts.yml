name: Probe independent YouTube caption provider

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Probe ten videos through SumMyNews
        run: python probe_summynews.py

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-provider-evidence
          path: provider-artifacts/
          if-no-files-found: warn
          retention-days: 7
